<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NID Studio — Modelo de Proposta</title>
  <meta name="description" content="Modelo editável de proposta comercial NID Studio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/proposta.css">
  <link rel="stylesheet" href="assets/proposta-layout.css">
  <style>
    .modelo-bar {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(46, 24, 16, .94);
      color: #fff0df;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 12px;
      backdrop-filter: blur(10px);
    }
    .modelo-bar a, .modelo-bar button {
      padding: 8px 14px;
      border: 1px solid rgba(226, 179, 143, .45);
      border-radius: 999px;
      background: transparent;
      color: #fff0df;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-decoration: none;
      cursor: pointer;
    }
    .modelo-bar a:hover, .modelo-bar button:hover { background: rgba(255, 240, 223, .12); }
    .modelo-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    body.has-bar { padding-top: 52px; }
    @media print { .modelo-bar { display: none; } body.has-bar { padding-top: 0; } }
  </style>
</head>
<body class="has-bar">
  <div class="modelo-bar">
    <span>Modelo NID Studio — visualização automática</span>
    <div class="actions">
      <a href="editor.html">✏️ Editar proposta</a>
      <button type="button" id="btn-print">Gerar PDF (página contínua)</button>
    </div>
  </div>
  <div id="app"></div>
  <script src="scripts/proposta-store.js"></script>
  <script src="scripts/escopo-canvas.js"></script>
  <script src="scripts/proposta-render.js"></script>
  <script>
    (async function () {
      const app = document.getElementById('app');
      const shouldPrint = /[?&]print=1/.test(location.search);
      const store = window.NidPropostaStore;

      async function runPrint() {
        if (store?.waitForImages) await store.waitForImages(document, 15000);
        await document.fonts?.ready;
        window.print();
      }

      try {
        const dados = await NidProposta.loadDados();
        app.innerHTML = NidProposta.renderProposta(dados);
        document.title = (dados.meta?.tituloPagina || 'Proposta') + ' · ' + (dados.capa?.cliente || '');
        NidProposta.applyImagens(document, dados);
        NidProposta.initNav(document);
        document.querySelectorAll('[data-print-pdf]').forEach((btn) => {
          btn.addEventListener('click', runPrint);
        });
        if (shouldPrint) {
          if (store?.waitForImages) await store.waitForImages(document, 15000);
          await document.fonts?.ready;
          setTimeout(runPrint, 400);
        }
      } catch (err) {
        app.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Erro ao carregar a proposta. Abra o <a href="editor.html">editor</a> ou verifique o arquivo <code>proposta-dados.json</code>.</p>';
        console.error(err);
      }
      document.getElementById('btn-print')?.addEventListener('click', runPrint);
    })();
  </script>
</body>
</html>
