<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Proposta — NID Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #704d3f;
      --cream: #fff0df;
      --off: #faf6f1;
      --line: rgba(112, 77, 63, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 14px;
      color: #3d2315;
      background: var(--off);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: var(--brown);
      color: var(--cream);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: .8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbar button, .toolbar label.btn-file {
      padding: 9px 14px;
      border: 1px solid rgba(255, 240, 223, .35);
      border-radius: 8px;
      background: rgba(255, 255, 255, .08);
      color: var(--cream);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--cream); color: var(--brown); border-color: var(--cream); }
    .toolbar button:hover, .toolbar label.btn-file:hover { background: rgba(255, 255, 255, .18); }
    .toolbar label.btn-file input { display: none; }
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 0;
      min-height: calc(100vh - 72px);
    }
    nav.side {
      padding: 20px 12px;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    nav.side a {
      display: block;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      color: var(--brown);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    nav.side a:hover, nav.side a.on { background: var(--cream); }
    main.editor { padding: 24px 28px 80px; max-width: 820px; }
    .card {
      margin-bottom: 22px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 17px;
      color: var(--brown);
    }
    .card .hint {
      margin: 0 0 18px;
      color: #8a6f62;
      font-size: 12px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 12px 0 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #8a6f62;
    }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      color: #3d2315;
      background: var(--off);
    }
    textarea { min-height: 72px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .list-item {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: var(--off);
    }
    .list-item .row-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .list-item button {
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: #f3dcc6;
      color: var(--brown);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .add-btn {
      padding: 10px 14px;
      border: 1px dashed var(--brown);
      border-radius: 8px;
      background: transparent;
      color: var(--brown);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .logo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .logo-box img {
      display: block;
      max-width: 100%;
      max-height: 80px;
      margin-top: 8px;
      object-fit: contain;
    }
    .status {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--brown);
      color: var(--cream);
      font-size: 12px;
      opacity: 0;
      transition: opacity .25s;
    }
    .status.show { opacity: 1; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      nav.side { display: flex; flex-wrap: wrap; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
      nav.side a { margin: 0; }
      .row2, .logo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Editor de Proposta NID Studio</h1>
      <p>Altere textos e imagens aqui — sem código. Salve e visualize quando quiser.</p>
    </div>
    <div class="toolbar">
      <button type="button" class="primary" id="btn-preview">👁 Ver proposta</button>
      <button type="button" class="primary" id="btn-pdf">📄 Gerar PDF</button>
      <button type="button" id="btn-save">💾 Salvar no navegador</button>
      <button type="button" id="btn-json">⬇ Baixar dados</button>
      <label class="btn-file">⬆ Carregar dados<input type="file" id="file-json" accept=".json,application/json"></label>
      <button type="button" id="btn-export">📄 Baixar proposta pronta (HTML)</button>
      <button type="button" id="btn-reset">↺ Restaurar modelo GREMP3</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" aria-label="Seções">
      <a href="#sec-capa" class="on">Capa</a>
      <a href="#sec-logos">Logos</a>
      <a href="#sec-simbolos">Símbolos</a>
      <a href="#sec-sobre">Sobre</a>
      <a href="#sec-filosofia">Filosofia</a>
      <a href="#sec-servicos">Serviços</a>
      <a href="#sec-processo">Processo</a>
      <a href="#sec-financeiro">Investimento</a>
      <a href="#sec-condicoes">Condições</a>
      <a href="#sec-encerramento">Encerramento</a>
    </nav>

    <main class="editor" id="form-root"></main>
  </div>

  <div class="status" id="status" role="status"></div>

  <script src="scripts/proposta-store.js"></script>
  <script src="scripts/proposta-render.js"></script>
  <script>
    let dados = {};
    let mediaFiles = {};
    const store = window.NidPropostaStore;

    const statusEl = document.getElementById('status');
    function toast(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('show');
      setTimeout(() => statusEl.classList.remove('show'), 2200);
    }

    function field(label, id, value = '', type = 'text', hint = '') {
      const el = type === 'textarea'
        ? `<textarea id="${id}" data-path="${id}">${value}</textarea>`
        : `<input type="${type}" id="${id}" data-path="${id}" value="${String(value).replace(/"/g, '&quot;')}">`;
      return `<label for="${id}">${label}</label>${el}${hint ? `<p class="hint" style="margin-top:4px">${hint}</p>` : ''}`;
    }

    function renderForm() {
      const root = document.getElementById('form-root');
      const c = dados.capa || {};
      const img = dados.imagens || {};
      const leg = dados.logos || {};
      const src = (k) => mediaFiles[k] || img[k] || (k === 'logoCapa' ? leg.principal : k === 'logoEncerramento' ? leg.logoClara : '') || '';
      const proc = img.simbolosProcesso || [];
      root.innerHTML = `
        <section class="card" id="sec-capa">
          <h2>Capa</h2>
          <p class="hint">Nome do cliente, destinatário, resumo e data que aparecem na primeira página.</p>
          ${field('Nome do cliente / empreendimento', 'capa.cliente', c.cliente)}
          <div class="row2">
            ${field('Destinatário (rótulo)', 'capa.destinatarioRotulo', c.destinatarioRotulo || 'A/C')}
            ${field('Destinatário (nome)', 'capa.destinatario', c.destinatario)}
          </div>
          ${field('Resumo da proposta', 'capa.resumo', c.resumo, 'textarea')}
          ${field('Cidade e data', 'capa.dataLocal', c.dataLocal)}
          ${field('Tags (separadas por vírgula)', 'capa.tags', (c.tags || []).join(', '))}
        </section>

        <section class="card" id="sec-logos">
          <h2>Logos NID Studio</h2>
          <p class="hint">Áreas da proposta onde você envia a marca. Clique em <strong>Escolher imagem</strong> em cada espaço.</p>
          <div class="logo-grid">
            ${imgUpload('logoCapa', 'Capa — logo NID (lado esquerdo, área grande)', src('logoCapa'))}
            ${imgUpload('logoEncerramento', 'Encerramento — logo clara (fundo marrom)', src('logoEncerramento'))}
          </div>
        </section>

        <section class="card" id="sec-simbolos">
          <h2>Símbolos NID (upload)</h2>
          <p class="hint">Cada espaço corresponde a um ponto do layout. Se não enviar imagem, a proposta usa o desenho decorativo padrão (leque, arco, cápsula). PNG ou JPG com fundo transparente quando possível.</p>
          <div class="logo-grid">
            ${imgUpload('simboloSobreTopo', 'Sobre — símbolo canto superior direito', src('simboloSobreTopo'))}
            ${imgUpload('simboloSobreBase', 'Sobre — símbolo canto inferior esquerdo', src('simboloSobreBase'))}
          </div>
          <div class="logo-grid" style="margin-top:12px">
            ${imgUpload('simboloFilosofiaArco', 'Filosofia — símbolo no arco (Metodologia NID)', src('simboloFilosofiaArco'))}
            ${imgUpload('simboloFilosofiaRodape', 'Filosofia — símbolo rodapé (cápsula)', src('simboloFilosofiaRodape'))}
          </div>
          <p class="hint" style="margin-top:16px"><strong>Processo</strong> — um símbolo por etapa (8 cards). Se vazio, aparece o número da etapa.</p>
          <div class="logo-grid" style="grid-template-columns:repeat(4,1fr)">
            ${[0,1,2,3,4,5,6,7].map(i => imgUpload(`processo${i}`, `Etapa ${pad2(i+1)}`, mediaFiles[`processo${i}`] || proc[i] || '')).join('')}
          </div>
          <div style="margin-top:12px">
            ${imgUpload('simboloEncerramentoRodape', 'Encerramento — símbolo rodapé (cápsula)', src('simboloEncerramentoRodape'))}
          </div>
        </section>

        <section class="card" id="sec-sobre">
          <h2>Sobre o escritório</h2>
          <div id="sobre-paragrafos"></div>
          <button type="button" class="add-btn" data-add="sobre-paragrafos">+ Adicionar parágrafo</button>
        </section>

        <section class="card" id="sec-filosofia">
          <h2>Filosofia / Metodologia</h2>
          ${field('Título no arco', 'filosofia.tituloArco', dados.filosofia?.tituloArco || 'Metodologia NID.')}
          ${field('Destaque do manifesto', 'filosofia.manifestoDestaque', dados.filosofia?.manifestoDestaque)}
          ${field('Texto do manifesto', 'filosofia.manifesto', dados.filosofia?.manifesto, 'textarea')}
          <div id="filosofia-pilares"></div>
          <button type="button" class="add-btn" data-add="filosofia-pilares">+ Adicionar pilar (Conceito / Design…)</button>
        </section>

        <section class="card" id="sec-servicos">
          <h2>Serviços contratados</h2>
          <div id="servicos-itens"></div>
          <button type="button" class="add-btn" data-add="servicos-itens">+ Adicionar serviço</button>
        </section>

        <section class="card" id="sec-processo">
          <h2>Processo e diferenciais</h2>
          ${field('Introdução do processo', 'processo.intro', dados.processo?.intro, 'textarea')}
          <div id="processo-etapas"></div>
          <button type="button" class="add-btn" data-add="processo-etapas">+ Adicionar etapa do processo</button>
          <p class="hint" style="margin-top:16px">Itens da entrega final (um por linha):</p>
          ${field('', 'processo.entregaItens', (dados.processo?.entregaFinal?.itens || []).join('\n'), 'textarea')}
          <div id="processo-diferenciais" style="margin-top:16px"></div>
          <button type="button" class="add-btn" data-add="processo-diferenciais">+ Adicionar diferencial</button>
        </section>

        <section class="card" id="sec-financeiro">
          <h2>Investimento</h2>
          ${field('Valor total', 'financeiro.total', dados.financeiro?.total)}
          ${field('Nota abaixo do valor', 'financeiro.totalNota', dados.financeiro?.totalNota)}
          ${field('Rótulo do total', 'financeiro.totalRotulo', dados.financeiro?.totalRotulo)}
          <div id="financeiro-pagamentos"></div>
          <button type="button" class="add-btn" data-add="financeiro-pagamentos">+ Adicionar forma de pagamento</button>
          <div id="financeiro-infos" style="margin-top:16px"></div>
          <button type="button" class="add-btn" data-add="financeiro-infos">+ Adicionar informação</button>
        </section>

        <section class="card" id="sec-condicoes">
          <h2>Condições gerais</h2>
          <div id="condicoes-itens"></div>
          <button type="button" class="add-btn" data-add="condicoes-itens">+ Adicionar condição</button>
        </section>

        <section class="card" id="sec-encerramento">
          <h2>Encerramento</h2>
          ${field('Título', 'encerramento.titulo', dados.encerramento?.titulo)}
          ${field('Frase (antes do destaque)', 'encerramento.frase', dados.encerramento?.frase, 'textarea')}
          ${field('Frase em destaque', 'encerramento.fraseDestaque', dados.encerramento?.fraseDestaque)}
          <div id="encerramento-assinaturas"></div>
          <button type="button" class="add-btn" data-add="encerramento-assinaturas">+ Adicionar assinatura</button>
        </section>
      `;

      renderList('sobre-paragrafos', (dados.sobre?.paragrafos || []).map((p, i) => listTextarea(`sobre.paragrafos.${i}`, 'Parágrafo', p)));
      renderList('filosofia-pilares', (dados.filosofia?.pilares || dados.filosofia?.etapas || []).map((e, i) => listPilar(i, e)));
      renderList('servicos-itens', (dados.servicos?.itens || []).map((s, i) => listServico(i, s)));
      renderList('processo-etapas', (dados.processo?.etapas || []).map((e, i) => listProcesso(i, e)));
      renderList('processo-diferenciais', (dados.processo?.diferenciais || []).map((d, i) => listDiferencial(i, d)));
      renderList('financeiro-pagamentos', (dados.financeiro?.pagamentos || []).map((p, i) => listPagamento(i, p)));
      renderList('financeiro-infos', (dados.financeiro?.infos || []).map((inf, i) => listInfo(i, inf)));
      renderList('condicoes-itens', (dados.condicoes?.itens || []).map((x, i) => listCondicao(i, x)));
      renderList('encerramento-assinaturas', (dados.encerramento?.assinaturas || []).map((a, i) => listAssinatura(i, a)));

      bindEvents();
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function escAttr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function imgUpload(key, title, srcUrl) {
      const preview = srcUrl
        ? `<img src="${escAttr(srcUrl)}" alt="">`
        : '<img alt="" style="display:none">';
      return `<div class="logo-box"><strong>${title}</strong><br>
        <label class="btn-file" style="display:inline-block;margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer">
          Escolher imagem<input type="file" accept="image/*" data-media="${key}">
        </label>${preview}</div>`;
    }

    function renderList(id, htmlItems) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = htmlItems.join('') || '<p class="hint">Nenhum item ainda.</p>';
    }

    function listTextarea(path, label, value) {
      return `<div class="list-item">${field(label, path, value, 'textarea')}<div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listPilar(i, e) {
      return `<div class="list-item">${field('Título', `filosofia.pilares.${i}.titulo`, e.titulo)}
        ${field('Texto', `filosofia.pilares.${i}.texto`, e.texto, 'textarea')}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listServico(i, s) {
      return `<div class="list-item">
        ${field('Título do serviço', `servicos.itens.${i}.titulo`, s.titulo)}
        ${field('Categoria', `servicos.itens.${i}.categoria`, s.categoria)}
        ${field('Descrição', `servicos.itens.${i}.descricao`, s.descricao, 'textarea')}
        ${field('Entregáveis (um por linha)', `servicos.itens.${i}.entregaveis`, (s.entregaveis || []).join('\n'), 'textarea')}
        ${field('Badge', `servicos.itens.${i}.badge`, s.badge)}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listProcesso(i, e) {
      return `<div class="list-item"><div class="row2">
        ${field('Número', `processo.etapas.${i}.numero`, e.numero)}
        ${field('Título', `processo.etapas.${i}.titulo`, e.titulo)}
      </div>${field('Texto', `processo.etapas.${i}.texto`, e.texto, 'textarea')}
      <label><input type="checkbox" data-path="processo.etapas.${i}.marco" ${e.marco ? 'checked' : ''}> Marco crítico (destaque marrom)</label>
      <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listDiferencial(i, d) {
      return `<div class="list-item">${field('Título', `processo.diferenciais.${i}.titulo`, d.titulo)}
        ${field('Texto', `processo.diferenciais.${i}.texto`, d.texto, 'textarea')}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listPagamento(i, p) {
      return `<div class="list-item">${field('Rótulo', `financeiro.pagamentos.${i}.rotulo`, p.rotulo)}
        ${field('Valor', `financeiro.pagamentos.${i}.valor`, p.valor)}
        ${field('Observação', `financeiro.pagamentos.${i}.nota`, p.nota, 'textarea')}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listInfo(i, inf) {
      return `<div class="list-item">${field('Título', `financeiro.infos.${i}.titulo`, inf.titulo)}
        ${field('Texto', `financeiro.infos.${i}.texto`, inf.texto, 'textarea')}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listCondicao(i, x) {
      return `<div class="list-item"><div class="row2">
        ${field('Letra', `condicoes.itens.${i}.letra`, x.letra)}
        ${field('Título', `condicoes.itens.${i}.titulo`, x.titulo)}
      </div>${field('Texto', `condicoes.itens.${i}.texto`, x.texto, 'textarea')}
      <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function listAssinatura(i, a) {
      return `<div class="list-item">${field('Nome', `encerramento.assinaturas.${i}.nome`, a.nome)}
        ${field('Cargo / função', `encerramento.assinaturas.${i}.cargo`, a.cargo)}
        <div class="row-actions"><button type="button" data-remove-parent>Remover</button></div></div>`;
    }

    function setPath(obj, path, value) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        const key = parts[i];
        const next = parts[i + 1];
        if (cur[key] === undefined) cur[key] = /^\d+$/.test(next) ? [] : {};
        if (/^\d+$/.test(next) && !Array.isArray(cur[key])) cur[key] = [];
        cur = cur[/^\d+$/.test(key) ? Number(key) : key];
      }
      const last = parts[parts.length - 1];
      if (/^\d+$/.test(last)) cur[Number(last)] = value;
      else cur[last] = value;
    }

    function getPath(obj, path) {
      return path.split('.').reduce((a, k) => (a == null ? a : a[k]), obj);
    }

    function collectForm() {
      const out = JSON.parse(JSON.stringify(dados));
      out.sobre = out.sobre || { rotulo: '01 — Apresentação', titulo: 'Sobre o Escritório', paragrafos: [] };
      out.sobre.paragrafos = [];
      out.filosofia = out.filosofia || {};
      out.filosofia.pilares = [];
      out.servicos = out.servicos || {};
      out.servicos.itens = [];
      out.processo = out.processo || {};
      out.processo.etapas = [];
      out.processo.diferenciais = [];
      out.processo.entregaFinal = { rotulo: out.processo.entregaFinal?.rotulo || 'Entrega Final', itens: [] };
      out.financeiro = out.financeiro || {};
      out.financeiro.pagamentos = [];
      out.financeiro.infos = [];
      out.condicoes = out.condicoes || {};
      out.condicoes.itens = [];
      out.encerramento = out.encerramento || {};
      out.encerramento.assinaturas = [];

      document.querySelectorAll('[data-path]').forEach((el) => {
        const path = el.dataset.path;
        let val = el.type === 'checkbox' ? el.checked : el.value;
        if (path.endsWith('.entregaveis') || path === 'processo.entregaItens') {
          val = val.split('\n').map((s) => s.trim()).filter(Boolean);
          if (path === 'processo.entregaItens') {
            out.processo.entregaFinal.itens = val;
            return;
          }
        }
        if (path === 'capa.tags') {
          val = val.split(',').map((s) => s.trim()).filter(Boolean);
        }
        setPath(out, path, val);
      });
      const prev = dados.imagens || {};
      const imagens = {
        logoCapa: mediaFiles.logoCapa || prev.logoCapa || dados.logos?.principal || '',
        logoEncerramento: mediaFiles.logoEncerramento || prev.logoEncerramento || dados.logos?.logoClara || '',
        simboloSobreTopo: mediaFiles.simboloSobreTopo || prev.simboloSobreTopo || '',
        simboloSobreBase: mediaFiles.simboloSobreBase || prev.simboloSobreBase || '',
        simboloFilosofiaArco: mediaFiles.simboloFilosofiaArco || prev.simboloFilosofiaArco || '',
        simboloFilosofiaRodape: mediaFiles.simboloFilosofiaRodape || prev.simboloFilosofiaRodape || '',
        simboloEncerramentoRodape: mediaFiles.simboloEncerramentoRodape || prev.simboloEncerramentoRodape || '',
        simbolosProcesso: [0, 1, 2, 3, 4, 5, 6, 7].map(
          (i) => mediaFiles[`processo${i}`] || (prev.simbolosProcesso || [])[i] || ''
        ),
      };
      out.imagens = imagens;
      out.logos = {
        principal: imagens.logoCapa,
        logoClara: imagens.logoEncerramento,
      };
      return out;
    }

    function bindEvents() {
      document.querySelectorAll('[data-remove-parent]').forEach((btn) => {
        btn.addEventListener('click', () => {
          dados = collectForm();
          btn.closest('.list-item')?.remove();
          dados = collectForm();
          renderForm();
        });
      });

      document.querySelectorAll('[data-add]').forEach((btn) => {
        btn.addEventListener('click', () => {
          collectToDados();
          const id = btn.dataset.add;
          if (id === 'sobre-paragrafos') dados.sobre.paragrafos.push('');
          if (id === 'filosofia-pilares') {
            if (!dados.filosofia.pilares) dados.filosofia.pilares = [];
            dados.filosofia.pilares.push({ titulo: '', texto: '' });
          }
          if (id === 'servicos-itens') dados.servicos.itens.push({ categoria: 'Premium', titulo: '', descricao: '', entregaveis: [], badge: '' });
          if (id === 'processo-etapas') dados.processo.etapas.push({ numero: '', titulo: '', texto: '', marco: false });
          if (id === 'processo-diferenciais') dados.processo.diferenciais.push({ titulo: '', texto: '' });
          if (id === 'financeiro-pagamentos') dados.financeiro.pagamentos.push({ rotulo: '', valor: '', nota: '' });
          if (id === 'financeiro-infos') dados.financeiro.infos.push({ titulo: '', texto: '' });
          if (id === 'condicoes-itens') dados.condicoes.itens.push({ letra: '', titulo: '', texto: '' });
          if (id === 'encerramento-assinaturas') dados.encerramento.assinaturas.push({ nome: '', cargo: '' });
          renderForm();
        });
      });

      document.querySelectorAll('input[data-media]').forEach((input) => {
        input.addEventListener('change', async () => {
          const file = input.files?.[0];
          if (!file) return;
          const key = input.dataset.media;
          try {
            const b64 = store?.compressImage
              ? await store.compressImage(file)
              : await fileToDataUrl(file);
            mediaFiles[key] = b64;
            const preview = input.closest('.logo-box')?.querySelector('img');
            if (preview) { preview.src = b64; preview.style.display = 'block'; }
            const saved = persistAll();
            if (!saved.ok) {
              toast('Imagem na tela, mas não coube no navegador — use Baixar dados ou HTML');
            } else {
              toast(saved.warn || 'Imagem enviada e salva');
            }
          } catch (err) {
            console.error(err);
            toast('Erro ao processar imagem');
          }
          input.value = '';
        });
      });

      document.querySelectorAll('nav.side a').forEach((a) => {
        a.addEventListener('click', () => {
          document.querySelectorAll('nav.side a').forEach((x) => x.classList.remove('on'));
          a.classList.add('on');
        });
      });

      let saveTimer;
      document.getElementById('form-root').addEventListener('input', () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => persistAll(true), 400);
      });
    }

    function collectToDados() {
      dados = collectForm();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function persistAll(silent) {
      collectToDados();
      if (store?.setPreviewPayload) store.setPreviewPayload(dados);
      const result = store?.persistDados
        ? store.persistDados(dados)
        : (() => {
            try {
              localStorage.setItem('nid-proposta-dados', JSON.stringify(dados));
              return { ok: true };
            } catch (e) {
              return { ok: false, error: e };
            }
          })();
      if (!silent && result.ok) toast(result.warn || 'Salvo no navegador');
      if (!silent && !result.ok) toast('Não coube no navegador — baixe JSON ou HTML');
      return result;
    }

    function saveLocal() {
      persistAll();
    }

    function downloadJson() {
      collectToDados();
      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'proposta-dados.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Arquivo proposta-dados.json baixado');
    }

    async function exportHtml() {
      collectToDados();
      const [css, layoutCss, bootJs, renderJs, storeJs] = await Promise.all([
        fetch('assets/proposta.css').then((r) => r.text()),
        fetch('assets/proposta-layout.css').then((r) => r.text()),
        fetch('scripts/proposta-boot.js').then((r) => r.text()),
        fetch('scripts/proposta-render.js').then((r) => r.text()),
        fetch('scripts/proposta-store.js').then((r) => r.text()),
      ]);
      const html = NidProposta.buildStandaloneHtml(
        dados,
        css,
        layoutCss,
        `${renderJs}\n${storeJs}\n${bootJs}`
      );
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      const nome = (dados.capa?.cliente || 'proposta').replace(/\s+/g, '-').toLowerCase();
      a.href = URL.createObjectURL(blob);
      a.download = `Proposta-NID-${nome}.html`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Proposta HTML baixada — abra no navegador');
    }

    async function loadDefault() {
      dados = store?.loadDados
        ? await store.loadDados()
        : await fetch('proposta-dados.json').then((r) => r.json());
      mediaFiles = {};
      const im = dados.imagens || {};
      const lg = dados.logos || {};
      Object.assign(mediaFiles, {
        logoCapa: im.logoCapa || lg.principal,
        logoEncerramento: im.logoEncerramento || lg.logoClara,
        simboloSobreTopo: im.simboloSobreTopo,
        simboloSobreBase: im.simboloSobreBase,
        simboloFilosofiaArco: im.simboloFilosofiaArco,
        simboloFilosofiaRodape: im.simboloFilosofiaRodape,
        simboloEncerramentoRodape: im.simboloEncerramentoRodape,
      });
      (im.simbolosProcesso || []).forEach((v, i) => { if (v) mediaFiles[`processo${i}`] = v; });
      renderForm();
    }

    async function openStandalonePdf() {
      collectToDados();
      persistAll(true);
      try {
        const [css, layoutCss, bootJs, renderJs, storeJs] = await Promise.all([
          fetch('assets/proposta.css').then((r) => r.text()),
          fetch('assets/proposta-layout.css').then((r) => r.text()),
          fetch('scripts/proposta-boot.js').then((r) => r.text()),
          fetch('scripts/proposta-render.js').then((r) => r.text()),
          fetch('scripts/proposta-store.js').then((r) => r.text()),
        ]);
        const boot = `${renderJs}\n${storeJs}\n${bootJs}`;
        const html = NidProposta.buildStandaloneHtml(dados, css, layoutCss, boot);
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob) + '?print=1';
        const win = window.open(url, '_blank');
        if (!win) {
          toast('Permita pop-ups para gerar o PDF');
          URL.revokeObjectURL(url);
          return;
        }
        setTimeout(() => URL.revokeObjectURL(url), 120000);
      } catch (err) {
        console.error(err);
        toast('Erro ao gerar PDF — tente Ver proposta');
      }
    }

    function openPreview(forPrint) {
      const saved = persistAll(true);
      if (!saved.ok) {
        toast('Dados grandes demais — use Gerar PDF ou Baixar HTML');
        if (forPrint) { openStandalonePdf(); return; }
      }
      const url = forPrint ? 'modelo.html?print=1' : 'modelo.html';
      const win = window.open(url, '_blank');
      if (!win) toast('Permita pop-ups para abrir a proposta');
    }

    document.getElementById('btn-preview').addEventListener('click', () => openPreview(false));
    document.getElementById('btn-pdf').addEventListener('click', () => openStandalonePdf());
    document.getElementById('btn-save').addEventListener('click', saveLocal);
    document.getElementById('btn-json').addEventListener('click', downloadJson);
    document.getElementById('btn-export').addEventListener('click', exportHtml);
    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (!confirm('Restaurar o conteúdo original do case GREMP3?')) return;
      localStorage.removeItem('nid-proposta-dados');
      sessionStorage.removeItem('nid-proposta-dados');
      sessionStorage.removeItem('nid-proposta-preview');
      sessionStorage.removeItem('nid-proposta-preview:ts');
      const res = await fetch('proposta-dados.json');
      dados = await res.json();
      mediaFiles = {};
      const im = dados.imagens || {};
      const lg = dados.logos || {};
      Object.assign(mediaFiles, {
        logoCapa: im.logoCapa || lg.principal,
        logoEncerramento: im.logoEncerramento || lg.logoClara,
        simboloSobreTopo: im.simboloSobreTopo,
        simboloSobreBase: im.simboloSobreBase,
        simboloFilosofiaArco: im.simboloFilosofiaArco,
        simboloFilosofiaRodape: im.simboloFilosofiaRodape,
        simboloEncerramentoRodape: im.simboloEncerramentoRodape,
      });
      (im.simbolosProcesso || []).forEach((v, i) => { if (v) mediaFiles[`processo${i}`] = v; });
      renderForm();
      persistAll(true);
      toast('Modelo GREMP3 restaurado');
    });
    document.getElementById('file-json').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const text = await file.text();
      dados = JSON.parse(text);
      const im = dados.imagens || {};
      mediaFiles = {
        logoCapa: im.logoCapa || dados.logos?.principal,
        logoEncerramento: im.logoEncerramento || dados.logos?.logoClara,
        simboloSobreTopo: im.simboloSobreTopo,
        simboloSobreBase: im.simboloSobreBase,
        simboloFilosofiaArco: im.simboloFilosofiaArco,
        simboloFilosofiaRodape: im.simboloFilosofiaRodape,
        simboloEncerramentoRodape: im.simboloEncerramentoRodape,
      };
      (im.simbolosProcesso || []).forEach((v, i) => { if (v) mediaFiles[`processo${i}`] = v; });
      renderForm();
      toast('Dados carregados do arquivo');
      e.target.value = '';
    });

    loadDefault().catch((err) => {
      console.error(err);
      toast('Erro ao carregar modelo');
    });
  </script>
</body>
</html>
